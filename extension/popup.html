<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Web File Launcher</title></head>
<body><header><div class="brand"><span class="mark">↗</span><div><strong>Web File Launcher</strong><small>Tự mở file khi vào website</small></div></div><button id="refresh" class="icon" title="Kiểm tra lại kết nối" aria-label="Kiểm tra lại kết nối">↻</button></header>
<div class="site-bar"><span id="dot" class="dot"></span><span id="site">Đang lấy website hiện tại…</span></div>
<nav aria-label="Chức năng"><button id="tab-rules" class="tab active" aria-pressed="true">Quy tắc <span id="count">0</span></button><button id="tab-add" class="tab" aria-pressed="false">＋ Thêm mới</button><button id="tab-activity" class="tab" aria-pressed="false">Hoạt động</button></nav>
<p id="status" role="status" class="status" hidden></p>
<main><section id="rules"><div class="section-title"><h1>Quy tắc của bạn</h1><span id="connection">Đang kết nối…</span></div><div id="rule-list"></div></section>
<section id="add" hidden><h1>Thêm quy tắc</h1><form id="rule-form"><label>Tên quy tắc<input id="label" maxlength="80" placeholder="Python Server cho UET" required></label><label>Website<div class="input-row"><input id="website" type="url" placeholder="https://coding.uet.edu.vn/" required><button id="use-current" type="button" class="secondary" title="Dùng website hiện tại">Trang này</button></div><small id="scope">Áp dụng cho website này và mọi trang con.</small></label><label>Mở gì?<select id="kind"><option value="file">File / chương trình</option><option value="folder">Thư mục</option></select></label><label class="check"><input id="duplicate" type="checkbox" checked>Tránh mở trùng chương trình .exe</label><p class="hint">Chọn file trong hộp thoại Windows. Popup có thể đóng khi chuyển cửa sổ; mở lại tiện ích để xem kết quả.</p><button id="save" type="submit" class="primary full">Chọn file và lưu</button></form></section>
<section id="activity" hidden><div class="section-title"><h1>Hoạt động gần đây</h1><button id="clear" class="text">Xóa nhật ký</button></div><div id="event-list"></div></section></main>
<footer><span>Chrome & Edge · Lưu trên máy</span><span>by <strong>qu4nh</strong></span></footer><script type="module" src="popup.js"></script></body></html>
