<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Web File Launcher</title></head>
<body><header><div class="brand"><span class="mark">↗</span><div><strong>Web File Launcher</strong><small data-i18n="tagline">Open local files when you visit websites</small></div></div><button data-i18n-title="refresh" data-i18n-aria="refresh" id="refresh" class="icon" title="Refresh connection" aria-label="Refresh connection">↻</button></header>
<div class="site-bar"><span id="dot" class="dot"></span><span id="site" data-i18n="loadingSite">Getting current website…</span></div>
<nav data-i18n-aria="navigation" aria-label="Navigation"><button id="tab-rules" class="tab active" aria-pressed="true"><span data-i18n="rules">Rules</span> <span id="count">0</span></button><button id="tab-add" class="tab" aria-pressed="false" data-i18n="addTab">＋ Add new</button><button id="tab-activity" class="tab" aria-pressed="false" data-i18n="activity">Activity</button></nav>
<p id="status" role="status" class="status" hidden></p>
<main><section id="rules"><div class="section-title"><h1 data-i18n="yourRules">Your rules</h1><span id="connection" data-i18n="connecting">Connecting…</span></div><div id="rule-list"></div></section>
<section id="add" hidden><h1 data-i18n="addRule">Add a rule</h1><form id="rule-form"><label><span data-i18n="ruleName">Rule name</span><input data-i18n-placeholder="namePlaceholder" id="label" maxlength="80" placeholder="e.g. Project workspace" required></label><label><span data-i18n="website">Website</span><div class="input-row"><input id="website" type="url" placeholder="https://example.com/" required><button data-i18n="currentSite" data-i18n-title="currentSiteTitle" id="use-current" type="button" class="secondary" title="Use the current website">Current site</button></div><small id="scope" data-i18n="scope">Applies to this website and all its pages.</small></label><label><span data-i18n="target">What to open?</span><select id="kind"><option value="file" data-i18n="file">File / application</option><option value="folder" data-i18n="folder">Folder</option></select></label><label class="check"><input id="duplicate" type="checkbox" checked><span data-i18n="duplicate">Avoid launching an .exe that is already running</span></label><p class="hint" data-i18n="pickerHint">Choose a target in the Windows dialog. This popup may close; reopen it to see the result.</p><button id="save" type="submit" class="primary full" data-i18n="save">Choose target and save</button></form></section>
<section id="activity" hidden><div class="section-title"><h1 data-i18n="recent">Recent activity</h1><button data-i18n="clear" id="clear" class="text">Clear log</button></div><div id="event-list"></div></section></main>
<footer><span data-i18n="footer">Chrome & Edge · Stored locally</span><label class="language-picker"><span class="sr-only" data-i18n="language">Language</span><select id="language" aria-label="Language" data-i18n-aria="language"><option value="en">English</option><option value="vi">Tiếng Việt</option></select></label><span>by <strong>qu4nh</strong></span></footer><script type="module" src="popup.js"></script></body></html>
